apply plugin: 'com.android.application'

android {
    // Distinct from the CameraModule namespace (com.face) so the generated R and
    // BuildConfig classes of the two modules do not collide. applicationId keeps
    // the installed package name unchanged.
    namespace 'com.face.app'

    compileSdk 35

    defaultConfig {
        applicationId 'com.face'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }
}

dependencies {
    implementation project(':CameraModule')
}
