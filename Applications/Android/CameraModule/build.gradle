apply plugin: 'com.android.library'

android {
    // Required from AGP 8, and replaces package= in AndroidManifest.xml.
    // Kept as com.face so the existing "import com.face.R" in the sources and
    // the generated R class keep matching.
    namespace 'com.face'

    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 35

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_ARM_NEON=TRUE",
                          "-DANDROID_CPP_FEATURES=rtti exceptions"
            }
        }

        ndk {
            // arm64-v8a is required: Google Play has not accepted 32-bit only
            // uploads since 2019, and modern devices are 64-bit.
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }

    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            version '3.22.1'
        }
    }
}

dependencies {
    // AndroidX, replacing the end-of-life com.android.support:* artifacts.
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    implementation 'com.squareup.picasso:picasso:2.8'
    implementation 'com.jakewharton.timber:timber:5.0.1'
}
